reviews:
  profile: assertive
  poem: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  request_changes_workflow: true

  tools:
    eslint:
      enabled: false

  auto_review:
    enabled: true
    drafts: false
    # Pause automatic incremental reviews after 2 reviewed commits (default 5).
    # CodeRabbit meters reviews per DEVELOPER IDENTITY across every repo, in a rolling
    # 7-day window degrading from 30 reviews/7d, and every push spends one. This
    # enforces push-batching mechanically instead of relying on remembering to batch.
    auto_pause_after_reviewed_commits: 2
    # ignore_title_keywords REMOVED 2026-07-28. It listed "chore:", and Dependabot
    # titles in this estate are literally "chore: Bump X" — so every dependency PR was
    # being skipped silently. Dependency changes are classed HIGH in
    # .claude/review-policy.json on supply-chain grounds; skipping them was the exact
    # opposite of the intent. What gets skipped is now decided by PATH via that policy
    # file, not by a title that can lie about what a PR touches.
    #
    # Do NOT add ignore_usernames for dependabot[bot]/renovate[bot] either: Gitar
    # already skips bot-authored PRs unless allow-listed, so silencing CodeRabbit too
    # would leave supply-chain PRs with no AI review at all.

  path_filters:
    - "!**/bin/**"
    - "!**/obj/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/coverage/**"
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/yarn.lock"

  instructions: |
    Review as a senior engineer. Prioritise correctness, security, maintainability,
    testability, and accidental complexity.

    Do not nitpick style unless it affects readability or consistency.
    Prefer actionable findings over commentary.
    Call out missing tests for changed behaviour.
    Treat generated files, lock files, snapshots, and formatting churn as low value.

    For .NET code, pay particular attention to:
    - async/await correctness
    - cancellation token propagation
    - nullability
    - DI lifetime mistakes
    - EF Core query behaviour
    - exception handling and logging
    - test coverage around edge cases

    For TypeScript/React code, pay particular attention to:
    - state/effect dependency bugs
    - request spam or accidental polling
    - accessibility regressions
    - error/loading/empty states
    - unnecessary re-renders
