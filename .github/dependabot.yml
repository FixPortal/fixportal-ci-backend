version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      aspnetcore:
        patterns:
          - "Microsoft.AspNetCore.*"
      ef-core:
        patterns:
          - "Microsoft.EntityFrameworkCore"
          - "Microsoft.EntityFrameworkCore.*"
      xunit:
        patterns:
          - "xunit"
          - "xunit.*"
          - "xunit.v3"
          - "xunit.v3.*"
      testing:
        patterns:
          - "NSubstitute"
          - "NSubstitute.*"
          - "AwesomeAssertions"
          - "AwesomeAssertions.*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
      nodatime:
        patterns:
          - "NodaTime"
          - "NodaTime.*"
      serilog:
        patterns:
          - "Serilog"
          - "Serilog.*"
      azure-sdk:
        patterns:
          - "Azure.*"
          - "Microsoft.Azure.*"
    ignore:
      # Microsoft.OpenApi 3.x made IOpenApiMediaType.Example read-only, which the
      # net10 Microsoft.AspNetCore.OpenApi source generator still assigns (CS0200).
      # Pin to 2.x until AspNetCore.OpenApi ships a 3.x-compatible generator. See PR #25.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
