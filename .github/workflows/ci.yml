name: CI

on:
  # Deliberately narrow: all-branch pushes fire a second full run on every PR commit.
  # Concurrency does not safely solve that because push and PR refs differ.
  # Regression signal: two runs with one head SHA, one push and one pull_request.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel redundant in-progress runs on branches/PRs, but NEVER on main: a second
# push to main while a prior run's deploy is mid-flight must not cancel that run
# (workflow-level cancellation overrides the deploy job's own group). main runs
# therefore run to completion; the deploy job additionally guards itself.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Check C# formatting
        run: dotnet csharpier check .

      - name: Restore
        run: dotnet restore FixPortal.Ci.Backend.slnx

      - name: Build
        run: dotnet build FixPortal.Ci.Backend.slnx --configuration Release --no-restore

      # Coverage is collected by wrapping the existing test command, not by asking the test
      # platform for it. dotnet-coverage attaches to the process, so it needs no package
      # reference in the test project and stays off the collector path entirely --
      # coverlet.collector 10.0.1 emits invalid IL on .NET 10 (InvalidProgramException),
      # which is why this route is deliberate rather than incidental.
      #
      # Coverage reporting left this repo in the OSS cut with no replacement and no stated
      # rationale, so a contributor to a PUBLIC repository cannot see what a change drops.
      # REPORTED, NOT GATED: no threshold is enforced, so this cannot red a PR by itself.
      # Add a floor only with a measured baseline behind it.
      - name: Test
        run: >
          dotnet dotnet-coverage collect
          --output ./TestResults/coverage.cobertura.xml
          --output-format cobertura
          "dotnet test --solution FixPortal.Ci.Backend.slnx --configuration Release --no-build --report-xunit-trx --results-directory ./TestResults --timeout 5m"

      - name: Summarise coverage
        if: always()
        run: python3 .github/scripts/summarize_coverage.py ./TestResults/coverage.cobertura.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: |
            ./TestResults/*.trx
            ./TestResults/coverage.cobertura.xml
          if-no-files-found: ignore

  publish:
    name: Publish Image (GHCR)
    needs: [backend]
    # main-only, mirrors the deploy gate so the public image tracks main.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          # Pin to the deploy target architecture.
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/fixportal/fixportal-ci-backend:latest
            ghcr.io/fixportal/fixportal-ci-backend:sha-${{ github.sha }}

  deploy:
    name: Deploy (Azure Container Apps)
    needs: [publish]
    # main-only: the explicit ref check also blocks workflow_dispatch from a feature branch.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Deploy must never be cancelled mid-flight; keep this job-level so PR/feature
    # branch runs above can still cancel redundant CI without killing a live deploy.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      packages: read
    env:
      # Deployer-specific targets come from repository Secrets (Settings → Secrets
      # and variables → Actions) so no infra identifiers live in source AND they
      # are masked in the public Actions logs. The public custom domain is a plain
      # Variable. See operator-handoff.md for the full list and how to set them.
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ secrets.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      IMAGE_REPO: fixportal-ci-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Import image from GHCR into ACR
        env:
          IMAGE_TAG: ${{ github.sha }}
          # GHCR read token. Passed via env so the secret is not templated directly
          # into the command line in the workflow source.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Import the image the publish job already built and pushed, rather than
          # rebuilding from source, so ACR receives that same artifact. The SHA tag
          # is immutable by construction; --force makes a re-run of the same commit
          # idempotent (it overwrites the identical tag instead of erroring). It does
          # NOT itself verify digests.
          az acr import \
            --name "$ACR_NAME" \
            --source "ghcr.io/fixportal/fixportal-ci-backend:sha-$IMAGE_TAG" \
            --image "$IMAGE_REPO:$IMAGE_TAG" \
            --username "${{ github.actor }}" \
            --password "$GHCR_TOKEN" \
            --force

      - name: Deploy container app (Bicep)
        env:
          IMAGE_TAG: ${{ github.sha }}
          DASHBOARD_GH_TOKEN: ${{ secrets.DASHBOARD_GH_TOKEN }}
          # Both empty until the App is created; the template then omits the App entirely
          # and the dashboard keeps using the PAT, so this deploys safely either way.
          DASHBOARD_GH_APP_ID: ${{ vars.DASHBOARD_GH_APP_ID }}
          DASHBOARD_GH_APP_PRIVATE_KEY: ${{ secrets.DASHBOARD_GH_APP_PRIVATE_KEY }}
          CI_ADMIN_KEY: ${{ secrets.CI_ADMIN_KEY }}
          CI_IDE_API_KEY: ${{ secrets.CI_IDE_API_KEY }}
          ACA_ENVIRONMENT_ID: ${{ secrets.ACA_ENVIRONMENT_ID }}
          PULL_IDENTITY_ID: ${{ secrets.PULL_IDENTITY_ID }}
          CUSTOM_DOMAIN_CERT_ID: ${{ secrets.CUSTOM_DOMAIN_CERT_ID }}
          CUSTOM_DOMAIN_NAME: ${{ vars.CUSTOM_DOMAIN_NAME }}
          # JSON array string, e.g. ["https://www.fixportal.org"]. Passed via env (not
          # inlined into the command) so the shell doesn't strip the inner quotes. A
          # Secret (not a Variable) for consistency with the rest of the deploy config.
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          image="$ACR_LOGIN_SERVER/$IMAGE_REPO:$IMAGE_TAG"

          trimmed_ide_api_key="${CI_IDE_API_KEY#"${CI_IDE_API_KEY%%[![:space:]]*}"}"
          trimmed_ide_api_key="${trimmed_ide_api_key%"${trimmed_ide_api_key##*[![:space:]]}"}"
          if [ -z "$trimmed_ide_api_key" ] || [ "$CI_IDE_API_KEY" != "$trimmed_ide_api_key" ]; then
            echo "::error::CI_IDE_API_KEY must be non-empty and have no leading or trailing whitespace."
            exit 1
          fi

          if [ -n "$CUSTOM_DOMAIN_NAME" ] && [ -z "$CUSTOM_DOMAIN_CERT_ID" ]; then
            echo "CUSTOM_DOMAIN_CERT_ID must be set when CUSTOM_DOMAIN_NAME is set." >&2
            exit 1
          fi

          if [ -n "$CUSTOM_DOMAIN_CERT_ID" ] && [ -z "$CUSTOM_DOMAIN_NAME" ]; then
            echo "CUSTOM_DOMAIN_NAME must be set when CUSTOM_DOMAIN_CERT_ID is set." >&2
            exit 1
          fi

          # Keep the @secure() secrets (gitHubToken, adminKey) out of the az
          # argv — a command-line value is visible in the process table to
          # anything sharing the runner. jq writes them into a parameters file
          # with proper JSON escaping (a raw heredoc would break on a secret
          # containing a quote or backslash); the trap removes it even on failure.
          params_file="$(mktemp)"
          trap 'rm -f "$params_file"' EXIT
          # The App private key goes through the same jq path as the other secrets, and
          # for a stronger reason: a PEM is multi-line, so any route that does not escape
          # it properly corrupts the key rather than failing loudly.
          jq -n \
            --arg gitHubToken "$DASHBOARD_GH_TOKEN" \
            --arg adminKey "$CI_ADMIN_KEY" \
            --arg gitHubAppPrivateKey "$DASHBOARD_GH_APP_PRIVATE_KEY" \
            '{
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              "contentVersion": "1.0.0.0",
              "parameters": {
                "gitHubToken": { "value": $gitHubToken },
                "adminKey": { "value": $adminKey },
                "ideApiKey": { "value": env.CI_IDE_API_KEY },
                "gitHubAppPrivateKey": { "value": $gitHubAppPrivateKey }
              }
            }' > "$params_file"

          deploy_args=(
            --resource-group "$AZURE_RESOURCE_GROUP"
            --template-file deploy/bicep/main.bicep
            --parameters "@$params_file"
            --parameters
            image="$image"
            gitHubOwner=FixPortal
            managedEnvironmentId="$ACA_ENVIRONMENT_ID"
            acrLoginServer="$ACR_LOGIN_SERVER"
            pullIdentityId="$PULL_IDENTITY_ID"
            gitHubAppId="$DASHBOARD_GH_APP_ID"
          )

          if [ -n "$CUSTOM_DOMAIN_NAME" ]; then
            deploy_args+=(customDomainName="$CUSTOM_DOMAIN_NAME")
          fi

          if [ -n "$CUSTOM_DOMAIN_CERT_ID" ]; then
            deploy_args+=(customDomainCertificateId="$CUSTOM_DOMAIN_CERT_ID")
          fi

          if [ -n "$CORS_ALLOWED_ORIGINS" ]; then
            deploy_args+=(corsAllowedOrigins="$CORS_ALLOWED_ORIGINS")
          fi

          deployment_output=$(az deployment group create "${deploy_args[@]}" --query '{fqdn:properties.outputs.fqdn.value,appName:properties.outputs.appName.value}' -o json)
          fqdn=$(jq -r '.fqdn // empty' <<< "$deployment_output")
          app_name=$(jq -r '.appName // empty' <<< "$deployment_output")
          if [ -z "$fqdn" ] || [ -z "$app_name" ]; then
            echo "::error::Deployment did not return both FQDN and app name; aborting health probe."
            exit 1
          fi
          {
            echo "FQDN=$fqdn"
            echo "APP_NAME=$app_name"
          } >> "$GITHUB_ENV"

      - name: Restart active revision
        run: |
          set -euo pipefail
          active_revision=$(az containerapp revision list --name "$APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query '[?properties.active].name | [0]' -o tsv)
          if [ -z "$active_revision" ]; then
            echo "::error::No active Container Apps revision found; aborting health probe."
            exit 1
          fi
          az containerapp revision restart --name "$APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$active_revision"

      - name: CI IDE snapshot probe
        env:
          CI_IDE_API_KEY: ${{ secrets.CI_IDE_API_KEY }}
        run: |
          set -euo pipefail
          endpoint="https://$FQDN/api/ide/v1/snapshot"
          curl_config=$(mktemp)
          wrong_key_config=$(mktemp)
          response_headers=$(mktemp)
          response_body=$(mktemp)
          chmod 600 "$curl_config" "$wrong_key_config"
          trap 'rm -f "$curl_config" "$wrong_key_config" "$response_headers" "$response_body"' EXIT

          # The integration key is only written to mode-600 curl configs: never argv,
          # logs, or response output. The wrong key is derived so it cannot match.
          # @json escapes curl-config quotes and backslashes without putting the key in
          # jq's argv; stripping its outer JSON quotes leaves a valid curl string value.
          jq -rn 'env.CI_IDE_API_KEY | @json | "header = \"X-CI-IDE-Key: \(.[1:-1])\""' > "$curl_config"
          jq -rn '(env.CI_IDE_API_KEY + "x") | @json | "header = \"X-CI-IDE-Key: \(.[1:-1])\""' > "$wrong_key_config"

          # The restart deliberately rolls no revision for a secret-only change. Probe
          # the single-revision app's shared FQDN, not probe-driven ACA state or a
          # per-revision FQDN that is not DNS-resolvable in single-revision mode.
          for attempt in 1 2 3 4 5 6 7 8; do
            if code=$(curl --config "$curl_config" -sS -D "$response_headers" -o "$response_body" -w '%{http_code}' --max-time 15 "$endpoint"); then
              if [ "$code" = "204" ] && [ "$attempt" -lt 8 ]; then
                echo "Attempt $attempt: HTTP 204; snapshot is not ready yet."
                sleep 15
                continue
              fi
              break
            fi
            if [ "$attempt" -eq 8 ]; then
              echo "::error::CI IDE snapshot probe exhausted transport retries."
              exit 1
            fi
            echo "Attempt $attempt: transport failure; retrying."
            sleep 15
          done

          if [ "$code" != "200" ]; then
            echo "::error::CI IDE snapshot probe returned HTTP $code; expected 200."
            exit 1
          fi

          etag=$(sed -n 's/^[Ee][Tt][Aa][Gg]:[[:space:]]*//p' "$response_headers" | tr -d '\r' | head -n 1)
          if [[ ! "$etag" =~ ^W/\"sha256:[0-9a-f]{64}\"$ ]]; then
            echo "::error::CI IDE snapshot probe returned an invalid ETag."
            exit 1
          fi

          if ! jq -e '.schemaVersion == 1' "$response_body" > /dev/null; then
            echo "::error::CI IDE snapshot probe did not return numeric schemaVersion 1."
            exit 1
          fi
          echo "CI IDE snapshot: HTTP $code, ETag $etag, schemaVersion 1"

          # A 204 here means the conditional request landed on a replica that has
          # not served a snapshot yet (state.Current is null by design), not that
          # the ETag contract is broken — the two probes can hit different
          # instances behind the shared FQDN. Retry it like the initial probe;
          # only a terminal non-304 after a 200 has been served fails the gate.
          for attempt in 1 2 3 4 5 6 7 8; do
            if conditional_code=$(curl --config "$curl_config" -sS -D "$response_headers" -o /dev/null -w '%{http_code}' --max-time 15 --header "If-None-Match: $etag" "$endpoint"); then
              if [ "$conditional_code" = "204" ] && [ "$attempt" -lt 8 ]; then
                echo "Conditional attempt $attempt: HTTP 204; snapshot is not warm on this replica yet."
                sleep 15
                continue
              fi
              # A 200 means the snapshot CHANGED between the two requests. The
              # enrichment sweep republishes on its own cadence and this probe runs
              # seconds after a revision restart, which is exactly when the first
              # sweep lands, so a 200 here is the ETag contract working rather than
              # breaking. Re-baseline on the ETag that response carried and ask
              # again; only a probe that never converges fails the gate. On
              # 2026-08-18 a deploy of an otherwise healthy revision went red on a
              # 200 served 1.3s after the 200 that produced the ETag.
              if [ "$conditional_code" = "200" ] && [ "$attempt" -lt 8 ]; then
                rebaselined_etag=$(sed -n 's/^[Ee][Tt][Aa][Gg]:[[:space:]]*//p' "$response_headers" | tr -d '\r' | head -n 1)
                if [[ ! "$rebaselined_etag" =~ ^W/\"sha256:[0-9a-f]{64}\"$ ]]; then
                  echo "::error::CI IDE conditional snapshot probe returned HTTP 200 without a valid ETag to re-baseline on."
                  exit 1
                fi
                echo "Conditional attempt $attempt: HTTP 200; the snapshot changed under the probe. Re-baselining."
                etag="$rebaselined_etag"
                sleep 10
                continue
              fi
              break
            fi
            if [ "$attempt" -eq 8 ]; then
              echo "::error::CI IDE conditional snapshot probe failed to reach the app."
              exit 1
            fi
            echo "Conditional attempt $attempt: transport failure; retrying."
            sleep 15
          done
          if [ "$conditional_code" != "304" ]; then
            echo "::error::CI IDE conditional snapshot probe returned HTTP $conditional_code; expected 304."
            exit 1
          fi

          if ! wrong_key_code=$(curl --config "$wrong_key_config" -sS -o /dev/null -w '%{http_code}' --max-time 15 --header "If-None-Match: $etag" "$endpoint"); then
            echo "::error::CI IDE wrong-key snapshot probe failed to reach the app."
            exit 1
          fi
          if [ "$wrong_key_code" != "401" ]; then
            echo "::error::CI IDE wrong-key snapshot probe returned HTTP $wrong_key_code; expected 401."
            exit 1
          fi

      # The public projection is the product's purpose and ComputePublicSnapshot is
      # the security-critical private-repo strip; probe it alongside the IDE route.
      # 204 means the in-memory snapshot is not published yet (cold replica), so it
      # is retried like the IDE probes rather than failing the gate.
      - name: Public dashboard snapshot probe
        run: |
          set -euo pipefail
          endpoint="https://$FQDN/api/dashboard/snapshot"
          public_body=$(mktemp)
          trap 'rm -f "$public_body"' EXIT

          for attempt in 1 2 3 4 5 6 7 8; do
            if public_code=$(curl -sS -o "$public_body" -w '%{http_code}' --max-time 15 "$endpoint"); then
              if [ "$public_code" = "204" ] && [ "$attempt" -lt 8 ]; then
                echo "Attempt $attempt: HTTP 204; public snapshot is not published yet."
                sleep 15
                continue
              fi
              break
            fi
            if [ "$attempt" -eq 8 ]; then
              echo "::error::Public dashboard snapshot probe exhausted transport retries."
              exit 1
            fi
            echo "Attempt $attempt: transport failure; retrying."
            sleep 15
          done

          if [ "$public_code" != "200" ]; then
            echo "::error::Public dashboard snapshot probe returned HTTP $public_code; expected 200."
            exit 1
          fi
          if ! jq -e '.repositories | type == "array"' "$public_body" > /dev/null; then
            echo "::error::Public dashboard snapshot probe did not return a repositories array."
            exit 1
          fi
          if ! jq -e '[.repositories[].private] | all(. == false)' "$public_body" > /dev/null; then
            echo "::error::Public dashboard snapshot returned a private repository; the anonymous projection must be public-only."
            exit 1
          fi
          echo "Public dashboard snapshot: HTTP $public_code, repositories array present, public-only"

  gate-coverage:
    name: Gate coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert every job in this workflow is gated
        env:
          GATE_EXEMPT: publish deploy
        run: python3 .github/scripts/assert_gate_coverage.py .github/workflows/ci.yml

  # Required status check. Deliberately a pure aggregator of needs.*.result: it decides
  # what can merge, so it has no checkout, no parser and no network of its own.
  #
  # `if: always()` is load-bearing. Without it the job is SKIPPED when an upstream job
  # fails, a skipped job emits no check run at all, and a required context that never
  # reports leaves the pull request permanently unmergeable.
  #
  # `skipped` counts as a pass, which is what lets job-level `if:` conditions and path
  # filtering work; `failure` and `cancelled` do not.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [backend, gate-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any upstream job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Upstream results: ${{ join(needs.*.result, ', ') }}"
          exit 1
