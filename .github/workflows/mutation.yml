name: mutation

on:
  workflow_dispatch:
  schedule:
    - cron: '45 2 * * 6'

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    # 120, not 45. The old ceiling was sized while `mutate` was narrowed to a single file:
    # the 2026-08-15 run tested ONE mutant, skipped 1981 as "Removed by mutate filter", and
    # reported "The final mutation score is 100.00 %" in 1.6 minutes. Once the scope was
    # restored to the whole source tree the same lane creates 2654 mutants and tests 1895 of
    # them, and both scheduled runs since (2026-08-22 and 2026-08-29) were killed at exactly
    # 45 minutes with no score at all.
    #
    # The new bound is deliberately generous rather than fitted, because no completed run
    # exists to fit it to -- the honest total is still unmeasured, and the next green run is
    # what will supply it. Runner minutes are free on this public repository, so the only
    # cost of the wider bound is a longer wait when Stryker genuinely hangs.
    #
    # If it still cancels, the next lever is `coverage-analysis` in stryker-config.json:
    # it is `off`, so every one of the 1895 mutants re-runs all 518 tests. `perTest` runs
    # only the covering tests. That is an estate-wide default worth revisiting on its own
    # evidence, not a change to slip in under a timeout fix.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore FixPortal.Ci.Backend.slnx

      - name: Restore local tools
        run: dotnet tool restore

      - name: Run Stryker
        working-directory: tests/FixPortal.Ci.Backend.Api.Tests
        run: dotnet stryker --config-file ../../stryker-config.json

      - name: Summarize mutation report
        if: always()
        shell: pwsh
        run: |
          $latest = Get-ChildItem tests/FixPortal.Ci.Backend.Api.Tests/StrykerOutput -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $latest) { throw "No StrykerOutput directory found." }
          $report = Join-Path $latest.FullName 'reports/mutation-report.json'
          $jsonSummary = Join-Path $latest.FullName 'reports/mutation-summary.json'
          $mdSummary = Join-Path $latest.FullName 'reports/mutation-summary.md'
          ./scripts/summarize-stryker.ps1 -ReportPath $report -JsonOutputPath $jsonSummary -MarkdownOutputPath $mdSummary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload mutation summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-summary
          path: tests/FixPortal.Ci.Backend.Api.Tests/StrykerOutput/**/reports/mutation-summary.*

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: tests/FixPortal.Ci.Backend.Api.Tests/StrykerOutput/**
          if-no-files-found: error
