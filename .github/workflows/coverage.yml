name: coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  coverage:
    uses: FixPortal/fixportal-workflows/.github/workflows/dotnet-coverage.yml@3d7f6611767f8202ea14087f7d8b77875544cb3b # v1.0.0
    with:
      solution: FixPortal.Ci.Backend.slnx
