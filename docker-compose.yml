services:
  backend:
    image: ghcr.io/fixportal/fixportal-ci-backend:latest
    environment:
      GitHub__Token: ${GITHUB_TOKEN}
      GitHub__Owner: ${GITHUB_OWNER}
      # The unauthenticated /api/dashboard/snapshot endpoint serves the PUBLIC
      # snapshot only — private repos are filtered server-side. Do NOT set
      # Admin__ExposePrivateToGuests here: it makes that anonymous endpoint return
      # the full snapshot (private repos included). See .env.example to opt in for
      # a private, trusted-network deployment only.
      # Allow the frontend container on port 80.
      Cors__AllowedOrigins__0: http://localhost
      Dashboard__SnapshotPath: /app/data/dashboard-snapshot.json
    # Bound to loopback only: the frontend reaches this over the compose network
    # (BACKEND_URL: http://backend:8080), so the host mapping is for local tooling.
    # The snapshot endpoint is unauthenticated, so it must not be offered to the LAN.
    ports:
      - "127.0.0.1:5049:8080"
    volumes:
      - snapshot-data:/app/data

  frontend:
    # The board UI image, built and published from the open-source
    # fixportal-ci-frontend repo: https://github.com/FixPortal/fixportal-ci-frontend
    image: ghcr.io/fixportal/fixportal-ci-frontend:latest
    environment:
      # Internal service name; the frontend's nginx proxies /api/ to this.
      BACKEND_URL: http://backend:8080
    # Bound to loopback only, matching backend above. Cors__AllowedOrigins__0 is
    # http://localhost, so this was only ever meant to be reached from this host.
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      - backend

volumes:
  snapshot-data:
